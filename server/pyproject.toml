[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolstore-server"
version = "0.1.0"
description = "Central Registry Server for ToolStore"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlmodel>=0.0.14",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
]

[project.scripts]
dev = "uvicorn app.main:app --reload"

