[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolstore-webui"
version = "2.1.6"
description = "ToolStore Web UI — local management server for the Agent ToolStore platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    { name = "ToolStore Team" },
]
keywords = [
    "ai",
    "agent",
    "mcp",
    "tools",
    "tool-calling",
    "webui",
    "management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]
dependencies = [
    "agent-tool-store>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/Mrw33554432/AgentToolStore"
Repository = "https://github.com/Mrw33554432/AgentToolStore"
Issues = "https://github.com/Mrw33554432/AgentToolStore/issues"

[project.scripts]
toolstore-webui = "toolstore_webui.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolstore_webui"]
include = [
    "src/toolstore_webui/static/**/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
